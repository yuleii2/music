plugins {
    id "com.android.application"
}

android {
    namespace "com.k2.music"
    compileSdk 36

    defaultConfig {
        applicationId "com.k2.music"
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName "1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def appPackageBaseName = "guitar-chord-dictionary"

tasks.register("copyVersionedDebugApk", Copy) {
    group = "build"
    description = "Copies the debug APK to dist with a versioned file name."
    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(rootProject.layout.projectDirectory.dir("dist"))
    rename {
        "${appPackageBaseName}-v${android.defaultConfig.versionName}-debug.apk"
    }
}

tasks.matching { it.name == "assembleDebug" }.configureEach {
    finalizedBy("copyVersionedDebugApk")
}

def smokeTestClasses = layout.buildDirectory.dir("smokeTestClasses")

tasks.register("compileChordDataSmokeTest", JavaCompile) {
    dependsOn("compileDebugJavaWithJavac")
    source = fileTree("src/test/java") {
        include "**/*.java"
    }
    classpath = files("$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    destinationDirectory = smokeTestClasses
    options.release = 17
    options.encoding = "UTF-8"
}

tasks.register("chordDataSmokeTest", JavaExec) {
    dependsOn("compileChordDataSmokeTest")
    classpath = files(
            smokeTestClasses,
            "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes"
    )
    mainClass = "com.k2.music.ChordRepositorySmokeTest"
}
